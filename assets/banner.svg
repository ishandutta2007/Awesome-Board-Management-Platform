<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:url(#title-grad)}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#e2e8f0}.animated-bg-1,.animated-bg-2{animation:pulse 4s ease-in-out infinite;transform-origin:center}.animated-bg-2{animation:float 6s ease-in-out infinite}</style><rect width="1200" height="320" fill="url(#bg-grad)" rx="16"/><g class="animated-bg-1" opacity=".25"><circle cx="150" cy="80" r="120" fill="#6366f1" filter="url(#glow)"/><circle cx="1050" cy="240" r="140" fill="#a855f7" filter="url(#glow)"/></g><g opacity=".2"><line x1="100" x2="250" y1="260" y2="280" stroke="#818cf8" stroke-dasharray="4 4" stroke-width="2"/><line x1="250" x2="400" y1="280" y2="250" stroke="#818cf8" stroke-dasharray="4 4" stroke-width="2"/><line x1="800" x2="950" y1="70"