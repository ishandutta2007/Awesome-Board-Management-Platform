<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#title-grad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    
    /* Background subtle dynamic nodes */
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .animated-bg-1 { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
    .animated-bg-2 { animation: float 6s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Dynamic Shapes (Background decorative elements only) -->
  <g class="animated-bg-1" opacity="0.25">
    <circle cx="150" cy="80" r="120" fill="#6366f1" filter="url(#glow)" />
    <circle cx="1050" cy="240" r="140" fill="#a855f7" filter="url(#glow)" />
  </g>

  <!-- Governance Network Nodes (Decorative Background) -->
  <g opacity="0.2">
    <line x1="100" y1="260" x2="250" y2="280" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="250" y1="280" x2="400" y2="250" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="800" y1="70" x2="950" y2="50" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="950" y1="50" x2="1100" y2="90" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="100" cy="260" r="6" fill="#38bdf8" />
    <circle cx="250" cy="280" r="8" fill="#818cf8" />
    <circle cx="400" cy="250" r="6" fill="#c084fc" />
    <circle cx="800" cy="70" r="6" fill="#38bdf8" />
    <circle cx="950" cy="50" r="8" fill="#818cf8" />
    <circle cx="1100" cy="90" r="6" fill="#c084fc" />
  </g>

  <!-- Main Hero Content (Always Foreground & Crystal Clear) -->
  <!-- Top Icon / Emblem -->
  <g transform="translate(560, 40)" class="animated-bg-2">
    <rect x="-30" y="0" width="60" height="60" rx="16" fill="url(#title-grad)" opacity="0.9" />
    <path d="M-12 38 L0 16 L12 38 Z M-6 30 L6 30" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="23" r="3" fill="#ffffff" />
  </g>

  <!-- Main Title -->
  <text x="600" y="150" text-anchor="middle" class="title">Awesome Board Management Platform</text>
  
  <!-- Subtitle -->
  <text x="600" y="190" text-anchor="middle" class="subtitle">Curated Board Governance, Director Portals, Meeting Management &amp; GRC Ecosystem</text>

  <!-- Feature Pills / Badges (Foreground Footer of Banner) -->
  <g transform="translate(260, 235)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="200" height="38" rx="19" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="100" y="24" text-anchor="middle" class="badge-text">🏛️ Board Governance</text>

    <!-- Pill 2 -->
    <rect x="220" y="0" width="230" height="38" rx="19" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="335" y="24" text-anchor="middle" class="badge-text">📅 Meeting Automation</text>

    <!-- Pill 3 -->
    <rect x="470" y="0" width="210" height="38" rx="19" fill="url(#card-grad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="575" y="24" text-anchor="middle" class="badge-text">🛡️ Open-Source GRC</text>
  </g>
</svg>
